<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>MgCl2 – Composé ionique</title>

  <style>
    body {
      font-family: Calibri, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
    }
    button {
      font-family: inherit;
      font-size: 16px;
      margin-top: 10px;
    }
    #feedback {
      margin-top: 15px;
      font-weight: bold;
    }
    img {
      margin-top: 10px;
      max-width: 300px;
    }
  </style>
</head>

<body>

<h2>Représentation ionique du MgCl<sub>2</sub></h2>

<p>
Représentez graphiquement les ions présents dans le composé ionique
<strong>MgCl<sub>2</sub></strong>.
</p>

<ul>
  <li>Les ions doivent être <strong>séparés</strong>.</li>
  <li>
    Utilisez le bouton <strong>PT</strong> pour choisir les éléments
    (dans le menu vertical droit).
  </li>
  <li>Ajoutez les <strong>charges</strong> aux ions.</li>
</ul>

<!-- KETCHER -->
<iframe
  id="ketcherFrame"
  src="ketcher/index.html"
  width="800"
  height="500"
  style="border:1px solid #000;">
</iframe>

<br>

<button onclick="verifier()">Vérifier</button>

<div id="feedback"></div>

<script>
// Conversion du code de charge Molfile en charge réelle
function chargeReelle(code) {
  if (code === 1) return 3;
  if (code === 2) return 2;
  if (code === 3) return 1;
  if (code === 5) return -1;
  if (code === 6) return -2;
  if (code === 7) return -3;
  return 0;
}

function verifier() {

  var feedback = document.getElementById("feedback");
  feedback.innerHTML = "";

  var ketcher =
    document.getElementById("ketcherFrame").contentWindow.ketcher;

  ketcher.getMolfile().then(function(mol) {

    var lignes = mol.split("\n");

    var counts = lignes[3].trim().split(/\s+/);
    var nbAtomes = parseInt(counts[0], 10);
    var nbLiaisons = parseInt(counts[1], 10);

    var symboles = [];
    var codesCharge = [];

    for (var i = 0; i < nbAtomes; i++) {
      var p = lignes[4 + i].trim().split(/\s+/);
      symboles.push(p[3]);
      codesCharge.push(parseInt(p[5], 10));
    }

    /* 1) Atomes autorisés */
    for (i = 0; i < symboles.length; i++) {
      if (symboles[i] !== "Mg" && symboles[i] !== "Cl") {
        feedback.innerText =
          "Ce composé ionique ne contient que des ions Mg et Cl.";
        return;
      }
    }

    /* 2) Quantités */
    var nbMg = 0;
    var nbCl = 0;

    for (i = 0; i < symboles.length; i++) {
      if (symboles[i] === "Mg") nbMg++;
      if (symboles[i] === "Cl") nbCl++;
    }

    if (nbMg !== 1 || nbCl !== 2) {
      feedback.innerHTML =
        "Vous avez déterminé qu'il y a 1 ion Mg<sup>2+</sup> et " +
        "2 ions Cl<sup>-</sup>.<br>" +
        "Votre représentation doit en tenir compte.";
      return;
    }

    /* 3) Charges */
    for (i = 0; i < symboles.length; i++) {
      var charge = chargeReelle(codesCharge[i]);

      if (symboles[i] === "Mg" && charge !== 2) {
        feedback.innerHTML =
          "Ajoutez des charges aux atomes a l'aide de ces boutons " +
          "dans le menu de gauche.<br>" +
          "<img src='images/Img_boutons_charges_Ketcher.jpg' alt=';
      }

      if (symboles[i] === "Cl" && charge !== -1) {
        feedback.innerHTML =
          "Ajoutez des charges aux atomes a l'aide de ces boutons " +
          "dans le menu de gauche.<br>" +
          "<img src='images/Img_boutons_charges_Ketcher.jpg' altrn;
      }
    }

    /* 4) Liaisons */
    if (nbLiaisons > 0) {
      feedback.innerText =
        "Les ions d'un composé ionique ne sont pas liés entre eux.";
      return;
    }

    /* SUCCÈS */
    feedback.innerHTML =
      "Représentation correcte des ions Mg<sup>2+</sup> et Cl<sup>-</sup> " +
      "séparés dans le MgCl<sub>2</sub>.";
  });
}
</script>

</body>
</html>
